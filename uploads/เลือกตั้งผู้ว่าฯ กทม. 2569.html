  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

13px 12px; color:#5A5A66;\">แผนที่จุดเสี่ยง<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:1.1fr 1fr 1fr 1fr 1fr; background:#FBF7EE; border-bottom:1px solid #E0D8C8; font-size:13px;\">\n          <div data-i18n=\"r3label\" style=\"padding:13px 14px; font-weight:600; color:#3A3A45;\">🌳 สิ่งแวดล้อม<\u002Fdiv>\n          <div data-i18n=\"r3c1\" style=\"padding:13px 12px; color:#5A5A66;\">สวน 15 นาทีทุกเขต<\u002Fdiv>\n          <div data-i18n=\"r3c2\" style=\"padding:13px 12px; color:#5A5A66;\">ปลูกต้นไม้ 1 ล้านต้น<\u002Fdiv>\n          <div data-i18n=\"r3c3\" style=\"padding:13px 12px; color:#5A5A66;\">ลดฝุ่น PM2.5<\u002Fdiv>\n          <div data-i18n=\"r3c4\" style=\"padding:13px 12px; color:#5A5A66;\">คัดแยกขยะอัจฉริยะ<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:1.1fr 1fr 1fr 1fr 1fr; background:#F4EEE2; font-size:13px;\">\n          <div data-i18n=\"r4label\" style=\"padding:13px 14px; font-weight:600; color:#3A3A45;\">💼 เศรษฐกิจ<\u002Fdiv>\n          <div data-i18n=\"r4c1\" style=\"padding:13px 12px; color:#5A5A66;\">ตลาดนัดชุมชน<\u002Fdiv>\n          <div data-i18n=\"r4c2\" style=\"padding:13px 12px; color:#5A5A66;\">กองทุนร้านค้ารายย่อย<\u002Fdiv>\n          <div data-i18n=\"r4c3\" style=\"padding:13px 12px; color:#5A5A66;\">ลดขั้นตอนขออนุญาต<\u002Fdiv>\n          <div data-i18n=\"r4c4\" style=\"padding:13px 12px; color:#5A5A66;\">บริการดิจิทัลครบวงจร<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══ SECTION 4: RESULTS / COUNTDOWN ══ -->\n  <section id=\"sec-results\" style=\"scroll-margin-top:108px; background:#17171F; color:#F4EEE2;\">\n    <div style=\"max-width:1120px; margin:0 auto; padding:64px 20px 72px;\">\n      <span class=\"phase-pill\" style=\"background:#2A9D8F; color:#fff;\" data-i18n=\"phase3pill\">ระยะที่ 3 · หลังปิดหีบ<\u002Fspan>\n      <h2 data-i18n=\"s08title\" style=\"font-family:'Anuphan',sans-serif; font-weight:700; font-size:clamp(24px,4vw,38px); margin:8px 0 10px; letter-spacing:-0.01em;\">การนับคะแนน &amp; แสดงผล<\u002Fh2>\n      <p data-i18n=\"s08para\" style=\"font-size:16px; color:#B9B4A8; max-width:560px; margin:0 0 40px;\">ผลคะแนนจะเริ่มรายงานหลังปิดหีบ 17:00 น. โดยนับเปิดเผย ณ หน่วยเลือกตั้ง<\u002Fp>\n\n      <!-- BIG COUNTDOWN -->\n      <div style=\"background:#21212C; border-radius:20px; padding:40px 24px; text-align:center; margin-bottom:24px;\">\n        <div id=\"resCountdownLabel\" style=\"font-size:12px; font-weight:700; letter-spacing:.14em; color:#B9B4A8; margin-bottom:16px; text-transform:uppercase;\">ปิดหีบอีก<\u002Fdiv>\n        <div id=\"resCountdown\" class=\"cd-block\" style=\"font-family:'Anuphan',sans-serif; font-weight:800; font-size:clamp(48px,12vw,100px); line-height:1; color:#C8102E; letter-spacing:-.02em;\">--:--:--<\u002Fdiv>\n        <div id=\"resCountdownSub\" style=\"font-size:14px; color:#B9B4A8; margin-top:14px;\">เวลา 17:00 น. นับคะแนนเปิดเผย ณ หน่วยเลือกตั้ง<\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- 3 stat cards -->\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px;\">\n        <div style=\"background:#21212C; border-radius:14px; padding:20px 16px; text-align:center;\">\n          <div style=\"font-family:'Anuphan',sans-serif; font-weight:800; font-size:36px; line-height:1; color:#2A9D8F;\">4.4<span style=\"font-size:18px;\">ล้าน<\u002Fspan><\u002Fdiv>\n          <div data-i18n=\"statLabel1\" style=\"font-size:12px; color:#9a958a; margin-top:6px;\">ผู้มีสิทธิเลือกตั้ง<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#21212C; border-radius:14px; padding:20px 16px; text-align:center;\">\n          <div style=\"font-family:'Anuphan',sans-serif; font-weight:800; font-size:36px; line-height:1; color:#E2A03F;\">50<\u002Fdiv>\n          <div data-i18n=\"stat2label\" style=\"font-size:12px; color:#9a958a; margin-top:6px;\">เขตเลือกตั้ง<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#21212C; border-radius:14px; padding:20px 16px; text-align:center;\">\n          <div style=\"font-family:'Anuphan',sans-serif; font-weight:800; font-size:36px; line-height:1; color:#F4EEE2;\">~6,800<\u002Fdiv>\n          <div data-i18n=\"stat3label\" style=\"font-size:12px; color:#9a958a; margin-top:6px;\">หน่วยเลือกตั้ง<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:12px; color:#666; margin:16px 0 0; text-align:center;\" data-i18n=\"policyNote\">* ผลคะแนนอย่างเป็นทางการจาก กกต. หลังปิดหีบ 17:00 น.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer style=\"max-width:1120px; margin:0 auto; padding:36px 20px 52px;\">\n    <div style=\"display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; align-items:center; border-top:1px solid #E0D8C8; padding-top:22px;\">\n      <div style=\"display:flex; align-items:center; gap:8px;\">\n        <div style=\"width:20px; height:20px; border:2.5px solid #17171F; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;\">✕<\u002Fdiv>\n        <span data-i18n=\"footBrand\" style=\"font-family:'Anuphan',sans-serif; font-weight:700; font-size:13px;\">เลือกตั้งผู้ว่าฯ กทม. · 28 มิถุนายน 2569<\u002Fspan>\n      <\u002Fdiv>\n      <div data-i18n=\"footDisc\" style=\"font-size:11.5px; color:#9a9a9a; max-width:480px;\">อินโฟกราฟิกเพื่อการศึกษา · ปฏิทินอ้างอิงจาก กกต. · รายชื่อผู้สมัคร นโยบาย และผลคะแนนเป็นข้อมูลตัวอย่าง<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1120,&quot;height&quot;:900},&quot;showSampleNote&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;เนื้อหา&quot;}}\">\nclass Component extends DCLogic {\n  state = { cardIndex: 0 };\n  renderVals() {\n    return {\n      showSampleNote: this.props.showSampleNote ?? true,\n      toggleLang: () => this.toggleLang(),\n      prevCard: () => this.moveCarousel(-1),\n      nextCard: () => this.moveCarousel(1),\n    };\n  }\n  componentDidMount() {\n    this.lang = 'th';\n    this._orig = new WeakMap();\n    this.pollClose = new Date('2026-06-28T17:00:00+07:00').getTime();\n    this.pollOpen  = new Date('2026-06-28T08:00:00+07:00').getTime();\n    this.renderHeaderCd();\n    this.renderResultsCd();\n    this._cd = setInterval(() => { this.renderHeaderCd(); this.renderResultsCd(); }, 1000);\n    this.setupScrollSpy();\n    this.initCarousel();\n  }\n  componentWillUnmount() {\n    if (this._cd) clearInterval(this._cd);\n    if (this._spy) document.removeEventListener('scroll', this._spy);\n  }\n  componentDidUpdate() {\n    if (this.lang === 'en') this.applyLang('en');\n    this.renderHeaderCd();\n    this.renderResultsCd();\n    this.syncCarousel(false);\n  }\n\n  /* ── Header countdown ── */\n  renderHeaderCd() {\n    const el = document.getElementById('cdTimer');\n    const dot = document.getElementById('cdDot');\n    if (!el) return;\n    const en = this.lang === 'en';\n    const now = Date.now();\n    const p = (n) => String(n).padStart(2, '0');\n    if (now < this.pollOpen) {\n      let d = this.pollOpen - now;\n      const h = Math.floor(d/3600000); d -= h*3600000;\n      const m = Math.floor(d/60000); d -= m*60000;\n      const s = Math.floor(d/1000);\n      el.textContent = en ? `Opens in ${p(h)}:${p(m)}:${p(s)}` : `เปิดหีบอีก ${p(h)}:${p(m)}:${p(s)}`;\n      el.style.color = '#E2A03F'; if (dot) dot.style.background = '#E2A03F';\n    } else if (now < this.pollClose) {\n      let d = this.pollClose - now;\n      const h = Math.floor(d/3600000); d -= h*3600000;\n      const m = Math.floor(d/60000); d -= m*60000;\n      const s = Math.floor(d/1000);\n      el.textContent = en ? `🗳 LIVE · ${p(h)}:${p(m)}:${p(s)} left` : `🗳 วันนี้! ปิดหีบอีก ${p(h)}:${p(m)}:${p(s)}`;\n      el.style.color = '#C8102E'; if (dot) dot.style.background = '#C8102E';\n    } else {\n      el.textContent = en ? 'Polls closed · counting' : 'ปิดหีบแล้ว · กำลังนับ';\n      el.style.color = '#2A9D8F'; if (dot) dot.style.background = '#2A9D8F';\n    }\n  }\n\n  /* ── Results section countdown ── */\n  renderResultsCd() {\n    const cd = document.getElementById('resCountdown');\n    const lbl = document.getElementById('resCountdownLabel');\n    const sub = document.getElementById('resCountdownSub');\n    if (!cd) return;\n    const en = this.lang === 'en';\n    const now = Date.now();\n    const p = (n) => String(n).padStart(2, '0');\n    if (now < this.pollClose) {\n      let d = this.pollClose - now;\n      const h = Math.floor(d/3600000); d -= h*3600000;\n      const m = Math.floor(d/60000); d -= m*60000;\n      const s = Math.floor(d/1000);\n      cd.textContent = `${p(h)}:${p(m)}:${p(s)}`;\n      cd.style.color = '#C8102E';\n      if (lbl) lbl.textContent = en ? 'POLLS CLOSE IN' : 'ปิดหีบอีก';\n      if (sub) sub.textContent = en ? 'Votes counted openly at each station after 17:00' : 'เวลา 17:00 น. นับคะแนนเปิดเผย ณ หน่วยเลือกตั้ง';\n    } else {\n      // count up since close\n      let d = now - this.pollClose;\n      const h = Math.floor(d/3600000); d -= h*3600000;\n      const m = Math.floor(d/60000); d -= m*60000;\n      const s = Math.floor(d/1000);\n      cd.textContent = `+${p(h)}:${p(m)}:${p(s)}`;\n      cd.style.color = '#2A9D8F';\n      if (lbl) lbl.textContent = en ? 'COUNTING UNDERWAY — ELAPSED' : 'กำลังนับคะแนน — เวลาผ่านไป';\n      if (sub) sub.textContent = en ? 'Official results will be confirmed by the EC' : 'ผลอย่างเป็นทางการโดย กกต.';\n    }\n  }\n\n  /* ── Carousel ── */\n  initCarousel() {\n    this._totalCards = 4;\n    this._visibleCards = () => {\n      const w = window.innerWidth;\n      return w <= 640 ? 1 : 2;\n    };\n    this._maxIndex = () => Math.max(0, this._totalCards - this._visibleCards());\n    this.syncCarousel(false);\n    this._resizeHandler = () => {\n      const max = this._maxIndex();\n      if (this.state.cardIndex > max) this.setState({ cardIndex: max });\n      else this.syncCarousel(false);\n    };\n    window.addEventListener('resize', this._resizeHandler);\n    // touch swipe\n    const track = document.getElementById('carouselTrack');\n    if (track) {\n      let startX = 0;\n      track.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; }, { passive: true });\n      track.addEventListener('touchend', (e) => {\n        const dx = e.changedTouches[0].clientX - startX;\n        if (Math.abs(dx) > 40) this.moveCarousel(dx < 0 ? 1 : -1);\n      }, { passive: true });\n    }\n  }\n  moveCarousel(dir) {\n    const max = this._maxIndex();\n    const next = Math.min(max, Math.max(0, this.state.cardIndex + dir));\n    this.setState({ cardIndex: next });\n    this.syncCarousel(true);\n  }\n  syncCarousel(animate) {\n    const track = document.getElementById('carouselTrack');\n    const dotsEl = document.getElementById('carouselDots');\n    if (!track) return;\n    const vis = this._visibleCards();\n    const cardW = track.offsetWidth / vis;\n    const offset = this.state.cardIndex * cardW;\n    track.style.transition = animate ? 'transform .35s cubic-bezier(.4,0,.2,1)' : 'none';\n    track.style.transform = `translateX(-${offset}px)`;\n    // dots\n    if (dotsEl) {\n      const max = this._maxIndex();\n      const total = max + 1;\n      dotsEl.innerHTML = '';\n      for (let i = 0; i <= max; i++) {\n        const d = document.createElement('div');\n        d.style.cssText = `width:${i===this.state.cardIndex?'20px':'7px'};height:7px;border-radius:100px;background:${i===this.state.cardIndex?'#17171F':'#C8C0B4'};transition:all .25s;`;\n        dotsEl.appendChild(d);\n      }\n    }\n  }\n\n  /* ── Scroll spy ── */\n  setupScrollSpy() {\n    const ids = ['sec-overview','sec-eligible','sec-candidates','sec-results'];\n    const setActive = (id) => {\n      if (id === this._activeTab) return;\n      this._activeTab = id;\n      document.querySelectorAll('#sectionTabs a[data-tab]').forEach((a) => {\n        const on = a.getAttribute('data-tab') === id;\n        a.style.background = on ? '#17171F' : 'transparent';\n        a.style.color = on ? '#F4EEE2' : '#4A4A57';\n        if (on) {\n          const nav = document.getElementById('sectionTabs');\n          if (nav) {\n            const al = a.offsetLeft, ar = al + a.offsetWidth;\n            if (al < nav.scrollLeft || ar > nav.scrollLeft + nav.clientWidth)\n              nav.scrollTo({ left: al - 16, behavior: 'smooth' });\n          }\n        }\n      });\n    };\n    const onScroll = () => {\n      const line = 130;\n      let current = ids[0];\n      for (const id of ids) {\n        const el = document.getElementById(id);\n        if (el && el.getBoundingClientRect().top <= line) current = id;\n      }\n      setActive(current);\n    };\n    this._spy = onScroll;\n    document.addEventListener('scroll', onScroll, { passive: true });\n    onScroll();\n  }\n\n  /* ── i18n ── */\n  applyLang(lang) {\n    this.lang = lang;\n    const EN = Component.EN;\n    document.querySelectorAll('[data-i18n]').forEach((el) => {\n      const html = el.hasAttribute('data-i18n-html');\n      if (!this._orig.has(el)) this._orig.set(el, html ? el.innerHTML : el.textContent);\n      const key = el.getAttribute('data-i18n');\n      const val = (lang === 'en' && EN[key] != null) ? EN[key] : this._orig.get(el);\n      if (html) el.innerHTML = val; else el.textContent = val;\n    });\n    const btn = document.getElementById('langToggleBtn');\n    if (btn) btn.textContent = lang === 'en' ? 'ไทย' : 'EN';\n  }\n  toggleLang() {\n    this.applyLang(this.lang === 'en' ? 'th' : 'en');\n    this.renderHeaderCd();\n    this.renderResultsCd();\n  }\n}\nComponent.EN = {\n  brand:'BKK Governor Election 2026',\n  tab1:'Overview & Calendar', tab2:'Voter Guide', tab3:'Candidates & Policies', tab4:'Results',\n  kic
